com.parasoft.xtest.checkers.api.common.buildOnlyIfGenOrExec=true
com.parasoft.xtest.checkers.api.common.incrementalBuild=false
com.parasoft.xtest.checkers.api.common.workingDirectoryType=0
com.parasoft.xtest.checkers.api.config.name=Run Unit Tests
com.parasoft.xtest.checkers.api.config.path=Unit Testing
com.parasoft.xtest.checkers.api.config.tool=3
com.parasoft.xtest.checkers.api.config.version=7.2.0
com.parasoft.xtest.checkers.api.config.xtestVersion=1.0.1
com.parasoft.xtest.execution.api.cpp.options.test.flow.recipe.mode=utflow.recipe
com.parasoft.xtest.execution.api.enabled=true
com.parasoft.xtest.standards.api.enabled=false
com.parasoft.xtest.testgen.api.enabled=false

# --- Coverage: Statement, Decision, MC/DC ---
com.parasoft.xtest.execution.api.cpp.options.instrumentation.mode=custom_instr_mode
com.parasoft.xtest.execution.api.cpp.options.enable.function.coverage=false
com.parasoft.xtest.execution.api.cpp.options.enable.line.coverage=false
com.parasoft.xtest.execution.api.cpp.options.enable.stmt.coverage=true
com.parasoft.xtest.execution.api.cpp.options.enable.block.coverage=false
com.parasoft.xtest.execution.api.cpp.options.enable.path.coverage=false
com.parasoft.xtest.execution.api.cpp.options.enable.decision.coverage=true
com.parasoft.xtest.execution.api.cpp.options.enable.simple.condition.coverage=false
com.parasoft.xtest.execution.api.cpp.options.enable.mcdc.coverage=true
com.parasoft.xtest.execution.api.cpp.options.enable.call.coverage=false
# Generate detailed (source-annotated) coverage reports
com.parasoft.xtest.execution.api.cpp.options.generate.coverage.reports=true
com.parasoft.xtest.execution.api.cpp.options.coverage.reports.type=MCDC
