# C/C++test CLI settings for the ATM-ninja project

# --- Project creation from the Ninja compilation database (compile_commands.json) ---
# (the bdf.import.* keys apply to any file passed with -bdf, including .json)
bdf.import.compiler.family=gcc_13-64
bdf.import.c.compiler.exec=gcc
bdf.import.cpp.compiler.exec=g++
bdf.import.linker.exec=g++
# Create the C/C++test (Eclipse) project inside the workspace (cpptest/workspace/ATM-ninja);
# sources stay in src/ and include/ and are linked into it
bdf.import.location=WORKSPACE

# --- Reporting ---
report.format=html
report.contexts_details=true
report.test_params=true


# Detailed HTML coverage reports (annotated source code) for these coverage types
report.coverage_details_htmls=SC,DC,MCDC
